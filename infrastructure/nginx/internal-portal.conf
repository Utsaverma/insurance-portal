server {
    listen 80;
    server_name _;
    root  /usr/share/nginx/html;
    index index.html;

    # Photos and PDFs up to the API's 10 MB limit (nginx's default body limit is 1 MB).
    client_max_body_size 12m;

    add_header X-Frame-Options           "DENY"                            always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" always;

    location / { try_files $uri $uri/ /index.html; }

    # The SPA shell is unhashed and names the current hashed bundle, so it is revalidated on every load:
    # without this, browsers cache it heuristically and keep running the previous build after a deploy.
    # try_files lands here for / and for every deep link. A location with its own add_header does not
    # inherit the server-level ones, so the security headers are repeated.
    location = /index.html {
        add_header Cache-Control           "no-cache"                        always;
        add_header X-Frame-Options         "DENY"                            always;
        add_header X-Content-Type-Options  "nosniff"                         always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" always;
    }

    # theme-init.js is unhashed and must never be frozen by the immutable rule
    # below — a stale copy means a wrong theme on first paint. Exact-match
    # locations beat regex locations in nginx, so this wins.
    location = /theme-init.js {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API lives under /api so its routes can never collide with SPA routes such as /claims/:id.
    # Each location strips the /api prefix before proxying to the service.
    location /api/auth {
        proxy_pass       http://auth-service:8000/auth;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID    $request_id;
    }

    location /api/users {
        proxy_pass       http://auth-service:8000/users;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID    $request_id;
    }

    location /api/claims {
        proxy_pass       http://claims-service:8000/claims;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID    $request_id;
    }

    # Internal portal only: the customer portal has no reports, so its nginx does not route them.
    location /api/reports {
        proxy_pass       http://claims-service:8000/reports;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID    $request_id;
    }
}
