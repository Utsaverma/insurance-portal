version: '3.9'

services:
  # ─── DATA LAYER ─────────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout:  5s
      retries:  5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ─── BACKEND ────────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ../src/backend/auth-service
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL:                  ${DATABASE_URL}
      JWT_SECRET_KEY:                ${JWT_SECRET_KEY}
      JWT_ALGORITHM:                 ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES:   ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS:     ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      APP_ENV:                       production
      LOG_LEVEL:                     INFO
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval:     15s
      timeout:      5s
      retries:      5
      start_period: 10s
    restart: unless-stopped

  claims-service:
    build:
      context: ../src/backend/claims-service
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL:     ${DATABASE_URL}
      REDIS_URL:        ${REDIS_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      JWT_SECRET_KEY:   ${JWT_SECRET_KEY}
      JWT_ALGORITHM:    ${JWT_ALGORITHM:-HS256}
      UPLOAD_DIR:       /app/uploads
      MAX_FILE_SIZE_MB: 10
      ENVIRONMENT:      production
      LOG_LEVEL:        INFO
    volumes:
      - claims_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval:     15s
      timeout:      5s
      retries:      5
      start_period: 10s
    restart: unless-stopped

  # ─── FRONTEND ───────────────────────────────────────────────────────────────

  customer-portal:
    build:
      context: ../src/frontend/customer-portal
      dockerfile: Dockerfile
      args:
        # Empty string → axios uses relative paths → nginx proxies /auth/, /users/, /claims/
        VITE_API_BASE_URL: ""
    ports:
      - "3000:80"
    volumes:
      - ./nginx/customer-portal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - claims-service
    restart: unless-stopped

  internal-portal:
    build:
      context: ../src/frontend/internal-portal
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "3001:80"
    volumes:
      - ./nginx/internal-portal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - claims-service
    restart: unless-stopped

# ─── VOLUMES ──────────────────────────────────────────────────────────────────

volumes:
  postgres_data:
  claims_uploads:
