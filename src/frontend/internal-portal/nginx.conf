server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" always;
  location / { try_files $uri $uri/ /index.html; }

  # theme-init.js is unhashed and must never be frozen by the immutable rule
  # below — a stale copy means a wrong theme on first paint. Exact-match
  # locations beat regex locations in nginx, so this wins.
  location = /theme-init.js {
    add_header Cache-Control "no-cache" always;
  }

  location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
